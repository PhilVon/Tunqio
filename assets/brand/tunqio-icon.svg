<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Tunqio app icon</title>
  <desc id="desc">A stylized Q with integrated T and audio waveform.</desc>
  <defs>
    <linearGradient id="tunqioGradient" x1="72" y1="92" x2="452" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B000FF"/>
      <stop offset="42%" stop-color="#5B3DFF"/>
      <stop offset="72%" stop-color="#159BFF"/>
      <stop offset="100%" stop-color="#13E0D3"/>
    </linearGradient>
  </defs>

  <!-- Q ring -->
  <circle cx="250" cy="250" r="168"
          fill="none"
          stroke="url(#tunqioGradient)"
          stroke-width="54"
          stroke-linecap="round"
          stroke-dasharray="930 126"
          transform="rotate(-37 250 250)"/>

  <!-- Q tail -->
  <rect x="354" y="349" width="56" height="132" rx="28"
        fill="url(#tunqioGradient)"
        transform="rotate(-45 382 415)"/>

  <!-- T -->
  <rect x="104" y="166" width="150" height="48" rx="24"
        fill="url(#tunqioGradient)"/>
  <rect x="156" y="180" width="48" height="176" rx="24"
        fill="url(#tunqioGradient)"/>

  <!-- Waveform -->
  <rect x="250" y="229" width="34" height="82" rx="17"
        fill="url(#tunqioGradient)"/>
  <rect x="302" y="194" width="42" height="152" rx="21"
        fill="url(#tunqioGradient)"/>
  <rect x="362" y="225" width="36" height="90" rx="18"
        fill="url(#tunqioGradient)"/>
</svg>

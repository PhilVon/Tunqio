# PR gate (docs/build-test-release.md, "Continuous integration"). Target: under 15 minutes.
# Runner: windows-2025-vs2026 carries VS 2026 (MSVC v145), Windows SDK 10.0.26100 and LLVM, matching the pins
# in Directory.Build.props. Steps that belong to later stories (dxc preset validation, coverage upload) are
# added by those stories.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/cache@v4
        with:
          path: native/bass/.cache
          key: bass-${{ hashFiles('tools/native-deps.json') }}

      - name: Fetch native packages (BASS, hash-verified)
        shell: pwsh
        run: ./tools/fetch-native.ps1

      # ffprobe is not incidental to the tag-writer tests, it is the assertion: E3-S10's AC-105 claims the tags
      # are "readable by another tagger", and a reader that shares no code with TagLibSharp is the only thing
      # that can say so. The runner image has no ffmpeg, so without this the check would skip on the one
      # machine everybody reads the result from. It also restores FixtureLibraryTests.Generation_is_deterministic
      # to the full 60-file fixture set: without an encoder it only compares the 8 natively written ones.
      #
      # Retried because the source is a public feed and it does fail: this step came back
      # "ffmpeg not installed. The package was not found with the source(s) listed" on a run whose only change
      # was to a C++ test file, having installed cleanly an hour earlier. That is the feed, not the repository,
      # and a gate that goes red when somebody else's server has a bad minute teaches people to re-run rather
      # than to read. A hash-pinned download would remove the dependency rather than tolerate it, the way
      # tools/fetch-native.ps1 already does for BASS; that is T-136 and this is the stopgap.
      - name: Install ffmpeg (the independent tagger for the tag-writer tests)
        shell: pwsh
        run: |
          $delay = 5
          foreach ($attempt in 1..3) {
            choco install ffmpeg --no-progress -y
            if ($LASTEXITCODE -eq 0) { break }
            if ($attempt -eq 3) { throw "choco install ffmpeg failed $attempt times" }
            Write-Host "attempt $attempt failed; retrying in $delay s"
            Start-Sleep -Seconds $delay
            $delay *= 3
          }
          $env:PATH = "$env:PATH;C:\ProgramData\chocolatey\bin"
          # Not decoration: choco can exit 0 having installed nothing useful, and the tests below are told to
          # treat a missing ffprobe as a failure rather than a skip, so this is where that promise is kept.
          ffprobe -version | Select-Object -First 1
          ffmpeg -version | Select-Object -First 1

      - name: Native format check (clang-format)
        shell: pwsh
        run: ./tools/check-format.ps1

      - name: Build (Release x64, warnings as errors)
        run: msbuild Tunqio.sln -restore -p:Configuration=Release -p:Platform=x64 -warnaserror -m -nologo -v:minimal

      # T-125. The preset root is data the build has to place, and when it does not the app still runs: it falls
      # back to the preset compiled into the core, so the only symptom is a short preset list. Asserted over the
      # built app rather than in a test, because a test asserts against its own output directory and not the
      # one a user gets, and because MPCORE_PRESET_ROOT on a developer's machine hides the defect from anything
      # that asks the loader. The script never reads that variable.
      - name: Presets reached the built app
        shell: pwsh
        run: ./tools/check-presets.ps1

      # T-128. Same reasoning, different payload: mpcore.dll, the BASS DLLs it loads and the licence texts
      # ADR-003 requires shipping. Over the unpackaged output this has always been green; the package is where
      # it was not, and that step is at the bottom of this job.
      - name: The engine and its licences reached the built app
        shell: pwsh
        run: ./tools/check-package.ps1

      - name: Managed format check (dotnet format, after restore)
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '[\\/]artifacts[\\/]' } | ForEach-Object {
            dotnet format $_.FullName --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      - name: Build native tests (ASan)
        run: msbuild native/mpcore.tests/mpcore.tests.vcxproj -p:Configuration=ASan -p:Platform=x64 -m -nologo -v:minimal

      - name: Prepare test-results folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/test-results | Out-Null

      - name: Native tests (Release)
        run: artifacts/native/Release/x64/mpcore.tests.exe --reporter console::out=- --reporter JUnit::out=artifacts/test-results/mpcore.release.xml

      - name: Native tests (ASan)
        run: artifacts/native/ASan/x64/mpcore.tests.exe --reporter console::out=- --reporter JUnit::out=artifacts/test-results/mpcore.asan.xml

      - name: ASan catches a deliberate use-after-free
        shell: pwsh
        run: ./tools/check-asan.ps1

      - name: Managed tests
        shell: pwsh
        env:
          # The ffmpeg tests skip themselves when the tools are missing, so a developer without them is not
          # blocked by three reds they cannot act on. Here that convenience would be a liability: a broken
          # install step above would read as a green run with AC-105 silently unchecked. Setting this turns the
          # skip back into a failure, the same way PerfGate fails a benchmark run that gated nothing.
          TUNQIO_REQUIRE_FFMPEG: '1'
        run: |
          $failed = 0
          foreach ($proj in Get-ChildItem tests -Recurse -Filter *.Tests.csproj) {
            dotnet test $proj.FullName -c Release -p:Platform=x64 --no-build --logger "trx;LogFilePrefix=$($proj.BaseName)" --results-directory artifacts/test-results --collect:"XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      # The performance claims, asserted where they can be measured: BenchmarkDotNet owns the machine for the
      # samples it takes, which an xunit assertion running beside the rest of its assembly cannot. The search
      # p95 (E3-S9), the library open (E3-S1) and the upsert batch and first Tracks page (E3-S2, E3-S3) all
      # gate here; their xunit companions keep the correctness assertions and a loose bound. Generates its own
      # copy of the 100k database when tests/fixtures/library-100k.db is absent, which on CI it is.
      #
      # The budgets in the source are the claims made to users, measured on the reference machine. This runner
      # is not it and does not hold still: the same UpsertBatchAsync on identical code came back with medians of
      # 50.5, 63.7 and 173.8 ms across three runs, a 3.4x spread that is the disk rather than the code
      # (docs/spikes/wal-checkpoint-during-scan.md). TUNQIO_PERF_SLACK multiplies the budgets here rather than
      # weakening them in the source for everyone; the gate prints both numbers, so a p95 creeping past the real
      # budget is still readable off a green run.
      - name: Gated benchmarks (performance budgets on the 100k database)
        shell: pwsh
        env:
          TUNQIO_PERF_SLACK: '4'
        run: dotnet run -c Release -p:Platform=x64 --project tests/Tunqio.Benchmarks --no-build -- --gate --filter '*SearchBenchmarks*' '*LibraryOpenBenchmarks*' '*UpsertBenchmarks*'

      - name: Package MSIX (unsigned; signing lands with E8-S1)
        run: msbuild src/Tunqio.App/Tunqio.App.csproj -p:Configuration=Release -p:Platform=x64 -p:TunqioPackaged=true -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -m -nologo -v:minimal

      # T-128. The package is the artifact this job hands to a human, and until now it was the one thing nothing
      # here opened: every MSIX uploaded before this step existed had no audio engine in it. Both checks run
      # over the .msix itself, which is a zip, so what is asserted is what a user would unpack - not what the
      # build log claims it placed. The unsigned package is checked rather than a layout folder for the same
      # reason. This runs after the package step and therefore over the packaged shape of $(OutDir); the
      # unpackaged assertions are the two steps up near the solution build.
      - name: The package is a real Tunqio (engine, BASS, licences, presets)
        shell: pwsh
        run: |
          $msix = Get-ChildItem artifacts/msix -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw 'The package step produced no .msix.' }
          ./tools/check-package.ps1 -Root artifacts/bin/Tunqio.App/release_win-x64 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./tools/check-presets.ps1 -Root artifacts/bin/Tunqio.App/release_win-x64 -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**

      - uses: actions/upload-artifact@v4
        with:
          name: tunqio-msix-unsigned
          path: |
            artifacts/msix/**/*.msix
            artifacts/native/Release/x64/mpcore.pdb
          if-no-files-found: error

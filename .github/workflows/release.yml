# Release (docs/build-test-release.md, "Release", as built by T-80 / E8-S1). Runs only when a version tag v* is pushed; ordinary
# pushes run ci.yml only (Q-128, D-35). It builds and tests exactly as ci.yml does, then stamps, signs and publishes:
#
#   tag vM.m.p       -> MSIX M.m.p.0      tag vM.m.p-rc.N  -> MSIX M.m.p.N      (tools/release-version.ps1)
#
# Every ci.yml step is repeated here verbatim and in order; tools/check-release-workflow.py fails if one drifts or goes
# missing, so a gate added to ci.yml must be added here too. The only actions are ci.yml's own and first-party actions/*;
# the release is created with the gh CLI preinstalled on the runner.
#
# Secrets (Phil adds them; README.md, "Releasing Tunqio (maintainer)"):
#   TUNQIO_SIGNING_PFX_BASE64    the self-signed CN=Tunqio code-signing certificate with its key, as a base64 PFX
#   TUNQIO_SIGNING_PFX_PASSWORD  its password
# Missing or wrong secrets fail the second step, before the build; nothing is ever published unsigned.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  release:
    runs-on: windows-2025-vs2026
    timeout-minutes: 75
    steps:
      # Full history and tags: the notes read the commits since the previous tag, and the channel (latest or prerelease)
      # depends on which release tags exist.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/release-version.ps1 -Tag $env:TAG -Apply

      - name: Signing secrets are present and fit to sign (before the build)
        shell: pwsh
        env:
          TUNQIO_SIGNING_PFX_BASE64: ${{ secrets.TUNQIO_SIGNING_PFX_BASE64 }}
          TUNQIO_SIGNING_PFX_PASSWORD: ${{ secrets.TUNQIO_SIGNING_PFX_PASSWORD }}
        run: ./tools/release-sign.ps1 -CheckOnly

      # ---- ci.yml, verbatim from here to the package check ------------------------------------------------------------------

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - uses: microsoft/setup-msbuild@v2

      - uses: actions/cache@v4
        with:
          path: native/bass/.cache
          key: bass-${{ hashFiles('tools/native-deps.json') }}

      - name: Fetch native packages (BASS, hash-verified)
        shell: pwsh
        run: ./tools/fetch-native.ps1

      - uses: actions/cache@v4
        with:
          path: artifacts/ffmpeg/.cache
          key: ffmpeg-${{ hashFiles('tools/ffmpeg-dep.json') }}

      - name: Fetch ffmpeg (the independent tagger for the tag-writer tests, hash-verified)
        shell: pwsh
        run: ./tools/fetch-ffmpeg.ps1

      - name: Check ffmpeg is on PATH
        shell: pwsh
        run: |
          ffprobe -version | Select-Object -First 1
          ffmpeg -version | Select-Object -First 1

      - name: Native format check (clang-format)
        shell: pwsh
        run: ./tools/check-format.ps1

      - name: Build (Release x64, warnings as errors)
        run: msbuild Tunqio.sln -restore -p:Configuration=Release -p:Platform=x64 -warnaserror -m -nologo -v:minimal

      - name: Presets reached the built app
        shell: pwsh
        run: ./tools/check-presets.ps1

      - name: The engine and its licences reached the built app
        shell: pwsh
        run: ./tools/check-package.ps1

      - name: Managed format check (dotnet format, after restore)
        shell: pwsh
        run: |
          $failed = 0
          Get-ChildItem -Recurse -Filter *.csproj | Where-Object { $_.FullName -notmatch '[\\/]artifacts[\\/]' } | ForEach-Object {
            dotnet format $_.FullName --verify-no-changes --no-restore
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      - name: Build native tests (ASan)
        run: msbuild native/mpcore.tests/mpcore.tests.vcxproj -p:Configuration=ASan -p:Platform=x64 -m -nologo -v:minimal

      - name: Prepare test-results folder
        shell: pwsh
        run: New-Item -ItemType Directory -Force artifacts/test-results | Out-Null

      - name: Native tests (Release)
        run: artifacts/native/Release/x64/mpcore.tests.exe --reporter console::out=- --reporter JUnit::out=artifacts/test-results/mpcore.release.xml

      - name: A caller built against the ABI 0.12 header is served what it declares
        run: artifacts/native/Release/x64/mpcore_abi_fixture_0_12.exe presets

      - name: Native tests (ASan)
        run: artifacts/native/ASan/x64/mpcore.tests.exe --reporter console::out=- --reporter JUnit::out=artifacts/test-results/mpcore.asan.xml

      - name: ASan catches a deliberate use-after-free
        shell: pwsh
        run: ./tools/check-asan.ps1

      - name: Managed tests
        shell: pwsh
        env:
          TUNQIO_REQUIRE_FFMPEG: '1'
        run: |
          $failed = 0
          foreach ($proj in Get-ChildItem tests -Recurse -Filter *.Tests.csproj) {
            dotnet test $proj.FullName -c Release -p:Platform=x64 --no-build --logger "trx;LogFilePrefix=$($proj.BaseName)" --results-directory artifacts/test-results --collect:"XPlat Code Coverage"
            if ($LASTEXITCODE -ne 0) { $failed = 1 }
          }
          exit $failed

      - name: Gated benchmarks (performance budgets on the 100k database)
        shell: pwsh
        env:
          TUNQIO_PERF_SLACK: '4'
        run: dotnet run -c Release -p:Platform=x64 --project tests/Tunqio.Benchmarks --no-build -- --gate --filter '*SearchBenchmarks*' '*LibraryOpenBenchmarks*' '*UpsertBenchmarks*' '*CurationBenchmarks*'

      - name: Package MSIX (unsigned; release.yml signs its copy)
        run: msbuild src/Tunqio.App/Tunqio.App.csproj -p:Configuration=Release -p:Platform=x64 -p:TunqioPackaged=true -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -m -nologo -v:minimal

      - name: The package is a real Tunqio (engine, BASS, licences, presets)
        shell: pwsh
        run: |
          # T-190: Tunqio's own package by name. The packaged build also drops the Windows App Runtime packages into
          # artifacts/msix/Tunqio_*/Dependencies/<arch>/, and the first *.msix found was not guaranteed to be ours.
          $msix = @(Get-ChildItem artifacts/msix -Recurse -Filter Tunqio.msix | Where-Object { $_.Directory.Name -like 'Tunqio_*' })
          if ($msix.Count -ne 1) { throw "The package step should produce exactly one artifacts/msix/Tunqio_*/Tunqio.msix; found $($msix.Count): $(($msix | ForEach-Object FullName) -join ', ')" }
          $msix = $msix[0]
          Write-Output "package: $($msix.FullName)"
          ./tools/check-package.ps1 -Root artifacts/bin/Tunqio.App/release_win-x64_msix -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./tools/check-presets.ps1 -Root artifacts/bin/Tunqio.App/release_win-x64_msix -Msix $msix.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**

      # ---- release-only steps ---------------------------------------------------------------------------------------------

      - name: Stage release assets (package, dependencies, Tunqio.appinstaller, symbols)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./tools/release-assets.ps1 -Tag $env:TAG -OutDir artifacts/release

      - name: Sign the release package
        id: sign
        shell: pwsh
        env:
          TUNQIO_SIGNING_PFX_BASE64: ${{ secrets.TUNQIO_SIGNING_PFX_BASE64 }}
          TUNQIO_SIGNING_PFX_PASSWORD: ${{ secrets.TUNQIO_SIGNING_PFX_PASSWORD }}
          PACKAGE: ${{ steps.version.outputs.package }}
        run: ./tools/release-sign.ps1 -Msix "artifacts/release/$env:PACKAGE" -CerOut artifacts/release/Tunqio.cer

      - name: The signed package is still a real Tunqio
        shell: pwsh
        env:
          PACKAGE: ${{ steps.version.outputs.package }}
        run: |
          ./tools/check-package.ps1 -Root artifacts/bin/Tunqio.App/release_win-x64_msix -Msix "artifacts/release/$env:PACKAGE"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          ./tools/check-presets.ps1 -Root artifacts/bin/Tunqio.App/release_win-x64_msix -Msix "artifacts/release/$env:PACKAGE"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: SBOM (CycloneDX for the NuGet graph, plus tools/native-deps.json)
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          MSIX_VERSION: ${{ steps.version.outputs.msix_version }}
        run: ./tools/release-sbom.ps1 -Tag $env:TAG -OutFile "artifacts/release/Tunqio_$($env:MSIX_VERSION)_x64.cdx.json"

      - name: Release notes from the commits since the previous tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          THUMBPRINT: ${{ steps.sign.outputs.thumbprint }}
        run: ./tools/release-notes.ps1 -Tag $env:TAG -OutFile artifacts/release-notes.md -Thumbprint $env:THUMBPRINT

      # Kept on the run even if publishing fails, so a failed publish can be diagnosed without rebuilding.
      - uses: actions/upload-artifact@v4
        with:
          name: tunqio-release
          path: |
            artifacts/release/**
            artifacts/release-notes.md
          if-no-files-found: error

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SEMVER: ${{ steps.version.outputs.semver }}
          LATEST: ${{ steps.version.outputs.latest }}
          GITHUB_PRERELEASE: ${{ steps.version.outputs.github_prerelease }}
        run: |
          $assets = @(Get-ChildItem artifacts/release -File | ForEach-Object FullName)
          $ghArgs = @('release', 'create', $env:TAG) + $assets + @('--verify-tag', '--title', "Tunqio $env:SEMVER", '--notes-file', 'artifacts/release-notes.md', "--latest=$env:LATEST")
          if ($env:GITHUB_PRERELEASE -eq 'true') { $ghArgs += '--prerelease' }
          gh @ghArgs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The update address installed copies poll is frozen at 1.0; prove it now serves this release's file.
      - name: The frozen update address serves this release
        if: steps.version.outputs.latest == 'true'
        shell: pwsh
        run: |
          $url = 'https://github.com/PhilVon/Tunqio/releases/latest/download/Tunqio.appinstaller'
          $expected = [IO.File]::ReadAllText('artifacts/release/Tunqio.appinstaller')
          $served = Join-Path $env:RUNNER_TEMP 'served.appinstaller'
          for ($i = 1; $i -le 10; $i++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $served -UseBasicParsing
              if ([IO.File]::ReadAllText($served) -eq $expected) { Write-Output "served: $url"; exit 0 }
            } catch { Write-Output "attempt $($i): $($_.Exception.Message)" }
            Start-Sleep -Seconds 15
          }
          Write-Output "::error::$url does not serve this release's Tunqio.appinstaller after 10 attempts"
          exit 1
